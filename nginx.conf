# nginx config for the production image (AWS ECS / Fargate behind an ALB).
# Serves the Vite build as a single-page app. API paths never reach this
# container: the ALB routes /auth, /users, /recipes … to the API service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health check target for the ALB.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets never change — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys show up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes (/recipe/:id, /profile …) get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
